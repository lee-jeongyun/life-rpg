<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="20개의 질문으로 알아보는 나만의 인생 RPG 직업과 능력치"><title>내 인생 RPG</title><style>
:root{--bg:#0e1025;--panel:#191d3b;--line:#343960;--text:#fff;--muted:#a9afd0;--accent:#9b7bff;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29215d,#0e1025 55%);font-family:system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh}.app{max-width:620px;margin:auto;padding:22px 16px 42px}.brand{font-weight:900;letter-spacing:2px;font-size:13px;color:#c8bcff}.panel{background:#191d3bdd;border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:16px;box-shadow:0 15px 45px #0002}.hero{padding:30px 24px;background:linear-gradient(145deg,#272052,#6b35b8);border-radius:28px;overflow:hidden}.hero h1{font-size:40px;line-height:1.12;margin:24px 0 12px}.muted{color:var(--muted)}button{font:inherit;cursor:pointer}.btn{width:100%;border:0;border-radius:15px;padding:15px;font-weight:900;background:var(--accent);color:#fff;margin-top:18px}.btn.alt{background:#252a50;border:1px solid var(--line)}.progress{height:8px;background:#292e50;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .3s}.choice{width:100%;text-align:left;padding:16px;margin-top:10px;border-radius:15px;border:1px solid var(--line);background:#171a34;color:#fff}.choice.selected{border:2px solid var(--accent);background:#30265d}.hidden{display:none}.result{background:linear-gradient(145deg,#172554,#5b21b6);border-radius:25px;padding:25px}.emoji{font-size:76px;text-align:center;margin:15px}.job{text-align:center;font-size:34px;font-weight:950}.rarity{text-align:center;color:var(--gold);font-weight:900;letter-spacing:3px}.stats{margin-top:22px}.stat{margin:15px 0}.stathead{display:flex;justify-content:space-between;font-weight:800}.bar{height:9px;background:#ffffff25;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#fff;border-radius:99px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#ffffff12;border-radius:14px;padding:12px;text-align:center}.mini b{display:block;font-size:25px}.tag{display:inline-block;border:1px solid #ffffff40;border-radius:99px;padding:6px 10px;font-size:12px}.small{font-size:13px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}@media(max-width:420px){.hero h1{font-size:34px}}
</style></head><body><main class="app"><div class="brand">⚔ REAL LIFE RPG</div><section id="home"><div class="hero"><span class="tag">CHARACTER CREATION</span><h1>너의 인생을<br>RPG로 만들면?</h1><p class="muted">20개의 질문에 답하고<br>나만의 직업과 능력치를 발견해봐.</p><button class="btn" id="start">캐릭터 생성 시작 →</button></div><div class="panel"><b>🧬 캐릭터 시스템</b><div class="grid" style="margin-top:14px"><div class="mini">⚔️<br><b>6</b><span class="small">능력치</span></div><div class="mini">🧙<br><b>10</b><span class="small">직업</span></div></div><p class="small muted">회원가입 없이 바로 플레이 · 약 2분</p></div></section><section id="quiz" class="hidden"><div style="display:flex;justify-content:space-between"><b id="count">QUESTION 01 / 20</b><span id="pct" class="muted">5%</span></div><div class="progress" style="margin:12px 0 18px"><div id="prog" style="width:5%"></div></div><div class="panel"><span class="tag" id="cat">성향</span><h2 id="question"></h2><p class="muted small">가장 너다운 답을 선택해줘.</p><div id="choices"></div></div><div class="grid"><button class="btn alt" id="back">← 이전</button><button class="btn" id="next" disabled>다음 →</button></div></section><section id="result" class="hidden"><h2>너의 인생 캐릭터</h2><div class="result" id="card"><div class="rarity" id="rarity">SSR</div><div class="emoji" id="avatar">🧙</div><div class="job" id="job">전략가</div><p style="text-align:center" id="subtitle">지식의 탐구자</p><div class="grid"><div class="mini">LEVEL<b id="level">22</b></div><div class="mini">POWER<b id="power">420</b></div></div><div class="stats" id="stats"></div><p style="text-align:center" class="small">나의 인생, 나만의 스탯.</p></div><div class="panel"><h3 id="title"></h3><p id="desc" class="muted"></p><h3>✦ 고유 특성</h3><b id="trait"></b><p id="traitDesc" class="muted small"></p><h3>📜 추천 퀘스트</h3><b id="quest"></b><p id="questDesc" class="muted small"></p></div><button class="btn" id="share">결과 공유하기 ↗</button><button class="btn alt" id="save">카드 이미지 저장 ↓</button><button class="btn alt" id="again">다시 측정하기</button><p id="status" class="small muted"></p></section><div class="footer">재미로 즐기는 성향 테스트 · 실제 심리검사 결과가 아닙니다.</div></main><script>
const $=id=>document.getElementById(id);const qs=[['성향','새로운 아이디어가 떠오르면?',['바로 만들어본다','원리부터 분석한다','상상하며 발전시킨다','친구에게 먼저 말한다'],['VIT','INT','CRE','CHA']],['성향','친구들이 너에게 자주 하는 말은?',['너 진짜 창의적이다','넌 믿음직해','너는 운이 좋아','말을 재밌게 해'],['CRE','END','LUK','CHA']],['도전','어려운 일이 생기면?',['끝까지 해결한다','검색하고 분석한다','새로운 방법을 시도한다','일단 시작한다'],['END','INT','CRE','VIT']],['일상','쉬는 날 가장 하고 싶은 것은?',['새로운 콘텐츠','공부 또는 개발','친구와 놀기','푹 쉬기'],['CRE','INT','CHA','END']],['강점','너의 가장 큰 장점은?',['아이디어가 많다','빠르게 실행한다','꾸준하다','사람들과 잘 어울린다'],['CRE','VIT','END','CHA']],['목표','목표를 세우면?',['계획표를 만든다','일단 시작한다','끝까지 버틴다','기회를 기다린다'],['INT','VIT','END','LUK']],['학습','새로운 것을 배울 때?',['직접 해본다','원리를 이해한다','재미있으면 깊게 판다','친구와 배운다'],['VIT','INT','CRE','CHA']],['가치관','가장 뿌듯한 순간은?',['어려운 문제를 풀 때','결과물이 나왔을 때','목표를 달성할 때','인정받을 때'],['INT','CRE','END','CHA']],['모험','여행을 간다면?',['완벽히 계획한다','즉흥적으로 간다','새로운 곳을 탐험한다','친구와 추억을 만든다'],['INT','LUK','VIT','CHA']],['전투','게임에서 주로 맡는 역할은?',['전략 지휘관','앞장서는 딜러','팀을 지키는 탱커','분위기 메이커'],['INT','VIT','END','CHA']],['회복','스트레스를 받으면?',['혼자 정리한다','취미에 몰입한다','푹 잔다','친구와 이야기한다'],['INT','CRE','END','CHA']],['성장','실패했을 때?',['원인을 분석한다','다른 방법을 시도한다','다시 도전한다','운이 안 좋았다'],['INT','CRE','END','LUK']],['미래','미래의 나에게 바라는 것은?',['실력 있는 사람','내 것을 만드는 사람','원하는 것을 이루는 사람','안정적이고 행복한 사람'],['INT','CRE','VIT','END']],['관계','친구가 고민을 털어놓으면?',['해결 방법을 찾는다','끝까지 들어준다','분위기를 푼다','새 관점을 제시한다'],['INT','END','CHA','CRE']],['운','갑자기 하루가 비었다면?',['새로운 도전','좋아하는 것 몰입','친구에게 연락','계획 없이 즐기기'],['VIT','CRE','CHA','LUK']],['집중','무언가에 몰입하면?',['시간 가는 줄 모른다','완벽히 이해한다','끝을 볼 때까지 한다','결과를 만든다'],['CRE','INT','END','VIT']],['선택','중요한 결정을 할 때?',['데이터와 근거','직감','새로운 가능성','주변 사람과 상의'],['INT','LUK','CRE','CHA']],['성취','가장 갖고 싶은 능력은?',['빠른 학습','무한한 창의력','절대 포기하지 않는 힘','행운을 부르는 힘'],['INT','CRE','END','LUK']],['파티','친구들과 함께할 때?',['계획 세우기','분위기 띄우기','행동 시작하기','뒤에서 챙기기'],['INT','CHA','VIT','END']],['엔딩','인생 RPG 엔딩은?',['전설적인 발명가','나만의 세계를 만든 창작자','모험을 완주한 주인공','든든한 수호자'],['INT','CRE','VIT','END']]];
const info={INT:['🧠','지능','전략가','지식의 탐구자','분석적 사고','복잡한 문제를 풀어내는 힘.','지식의 던전 공략','새로운 기술 하나를 깊게 배워라.'],CRE:['🎨','창작자','창작자','상상력의 연금술사','아이디어 연금술','평범한 일상을 새로운 세계로 바꾼다.','나만의 세계 만들기','작은 창작물 하나를 완성하라.'],VIT:['⚔️','실행력','모험가','행동하는 주인공','돌진하는 용기','생각을 행동으로 바꾸는 힘.','새로운 모험 시작','미루던 일을 오늘 바로 시작하라.'],END:['🛡️','인내력','수호자','끝까지 버티는 자','불굴의 의지','어려움 속에서도 길을 지키는 힘.','끝까지 완주하기','작은 목표 하나를 완성하라.'],CHA:['👑','매력','리더','사람을 잇는 자','파티의 중심','사람들을 모으고 함께 나아가는 힘.','동료와 성장하기','친구와 함께 새로운 도전을 해봐.'],LUK:['🍀','운','행운술사','기회의 수집가','럭키 플레이어','뜻밖의 기회를 발견하는 감각.','행운의 기회 찾기','평소와 다른 새로운 경험을 해봐.']};let n=0,ans=[],res;
function screen(s){['home','quiz','result'].forEach(x:$(x).classList.toggle('hidden',x!==s))}function render(){let q=qs[n];$('count').textContent=`QUESTION ${String(n+1).padStart(2,'0')} / 20`;$('pct').textContent=Math.round((n+1)/20*100)+'%';$('prog').style.width=(n+1)/20*100+'%';$('cat').textContent=q[0];$('question').textContent=q[1];$('choices').innerHTML='';q[2].forEach((t,i)=>{let b=document.createElement('button');b.className='choice'+(ans[n]===i?' selected':'');b.textContent=t;b.onclick=()=>{ans[n]=i;render()};$('choices').appendChild(b)});$('back').disabled=n===0;$('next').disabled=ans[n]===undefined;$('next').textContent=n===19?'결과 확인하기 ✨':'다음 →'}function calc(){let s={INT:50,CRE:50,VIT:50,END:50,CHA:50,LUK:50};ans.forEach((a,i)=>s[qs[i][3][a]]+=10);let order=Object.entries(s).sort((a,b)=>b[1]-a[1]),p=order[0][0],total=Object.values(s).reduce((a,b)=>a+b,0);return{s,order,p,level:20+Math.floor(total/40),power:Math.round(total*1.4),rarity:total>=410?'SSR':total>=370?'SR':'R'}}function result(){res=calc();let d=info[res.p];$('avatar').textContent=d[0];$('job').textContent=d[2];$('subtitle').textContent=d[3];$('rarity').textContent=res.rarity;$('level').textContent=res.level;$('power').textContent=res.power;$('title').textContent='「'+d[3]+'」';$('desc').textContent=d[5];$('trait').textContent=d[4];$('traitDesc').textContent=d[5];$('quest').textContent=d[6];$('questDesc').textContent=d[7];$('stats').innerHTML='';Object.entries(res.s).forEach(([k,v])=>{let row=document.createElement('div');row.className='stat';row.innerHTML=`<div class="stathead"><span>${info[k][0]} ${info[k][1]}</span><span>${v}</span></div><div class="bar"><i style="width:${v}%"></i></div>`;$('stats').appendChild(row)})}function share(){let text=`🎮 내 인생 RPG 결과\n직업: ${$('job').textContent}\n레벨: ${res.level}\n희귀도: ${res.rarity}\n${Object.entries(res.s).map(([k,v])=>info[k][1]+': '+v).join(' · ')}\n\n너도 인생 RPG를 측정해봐!`;if(navigator.share)navigator.share({title:'내 인생 RPG 결과',text}).catch(()=>{});else navigator.clipboard?.writeText(text).then(()=>$('status').textContent='공유 문구가 복사됐어!')}function save(){let c=document.createElement('canvas');c.width=1080;c.height=1350;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#172554');g.addColorStop(1,'#7e22ce');x.fillStyle=g;x.fillRect(0,0,1080,1350);x.fillStyle='#fff';x.textAlign='center';x.font='bold 38px sans-serif';x.fillText('REAL LIFE RPG',540,100);x.font='100px sans-serif';x.fillText($('avatar').textContent,540,270);x.font='bold 68px sans-serif';x.fillText($('job').textContent,540,400);x.font='38px sans-serif';x.fillText('Lv. '+res.level+' · '+res.rarity,540,470);x.textAlign='left';x.font='bold 32px sans-serif';Object.entries(res.s).forEach(([k,v],i)=>{let y=650+i*90;x.fillText(info[k][1],150,y);x.textAlign='right';x.fillText(v,930,y);x.textAlign='left';x.fillStyle='#ffffff35';x.fillRect(150,y+18,780,15);x.fillStyle='#fff';x.fillRect(150,y+18,780*v/100,15)});let a=document.createElement('a');a.download='my-life-rpg.png';a.href=c.toDataURL();a.click()}$('start').onclick=()=>{n=0;ans=[];screen('quiz');render()};$('next').onclick=()=>{if(n<19){n++;render()}else{result();screen('result')}};$('back').onclick=()=>{n--;render()};$('again').onclick=()=>{$('start').click()};$('share').onclick=share;$('save').onclick=save;
</script></body></html>
